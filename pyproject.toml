[project]
name = "bettermemory"
version = "1.5.0"
description = "Persistent memory for Claude Code, retrieved on demand."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mattias Rask" }]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "numpy>=1.24"]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Property-based store invariants (tests/test_store_properties.py).
    # Pinned only on the lower bound; any reasonably modern hypothesis
    # has the strategies we use.
    "hypothesis>=6.0",
]

[project.scripts]
bettermemory = "bettermemory.server:main"

[project.urls]
# Surfaced as the "Project links" rail on PyPI — without these the
# package page has no path back to source, issues, or release notes.
Homepage = "https://github.com/0Mattias/bettermemory"
Repository = "https://github.com/0Mattias/bettermemory"
Issues = "https://github.com/0Mattias/bettermemory/issues"
Changelog = "https://github.com/0Mattias/bettermemory/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bettermemory"]

[tool.mypy]
# Strict on the package itself — surfaces missing annotations and unused
# ignores immediately. Tests are looser: pytest fixtures and parametrize
# generate enough Any-typed scaffolding that strict-on-tests is mostly
# noise without much safety win.
files = ["src/bettermemory", "tests"]
python_version = "3.11"
strict = true
# Pydantic v2 ships its own mypy plugin for BaseModel field validation.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
# Pytest fixture composition produces a lot of "missing type arguments
# for generic dict" noise — silence it for tests only.
disable_error_code = ["type-arg", "no-untyped-def", "no-untyped-call"]

[[tool.mypy.overrides]]
# Optional extra. Without `embeddings` installed the import is missing
# at type-check time; the runtime path already handles ImportError.
module = ["sentence_transformers", "sentence_transformers.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Surface DeprecationWarnings from our own code as errors. We do NOT silence
# the python-frontmatter codecs.open() deprecation — instead we vendored our
# own frontmatter handling in store.py to drop the dependency entirely.
filterwarnings = [
    "error::DeprecationWarning:bettermemory",
]
markers = [
    # Tests that assert behavior when the `embeddings` extra is *not*
    # installed (e.g. get_model() returning None on ImportError). The
    # test-embeddings CI job runs `pytest -m \"not no_extras\"` so these
    # are skipped when sentence-transformers is present.
    "no_extras: requires the embeddings extra to be absent",
]

[tool.ruff.lint.per-file-ignores]
# conftest.py does sys.path manipulation before imports as a belt-and-suspenders
# fix for the iCloud UF_HIDDEN .venv issue — see the comment in conftest.py.
"tests/conftest.py" = ["E402"]
