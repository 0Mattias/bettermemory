[project]
name = "bettermemory"
version = "2.7.3"
description = "Memory you can verify — MCP-native memory for AI coding agents, with per-hit staleness verdicts and claim-level audit trails. Local-first, MIT, no cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mattias Rask" }]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "numpy>=1.24"]
# Lightweight alternative to `embeddings`: fastembed wraps ONNX Runtime
# (~50 MB on disk) instead of PyTorch (~500 MB). Same retrieval surface,
# same cache shape — different provider. When both extras are installed
# sentence-transformers wins for cache byte-stability; pick fastembed via
# `[behavior] semantic_provider = "fastembed"` when torch's footprint is
# the wrong tradeoff (CI runners, small VMs, air-gapped installs).
# fastembed wheels lag the latest Python by a release or two, so the
# `test-embeddings-fast` CI job pins to 3.13 even when the main matrix
# advances; users on 3.14 should install the standard `embeddings`
# extra until upstream catches up.
embeddings-fast = ["fastembed>=0.4", "numpy>=1.24"]
# The web UI imports `fastapi` and `uvicorn` directly — that's the
# whole runtime surface. `httpx` is *not* a runtime dep; it's only
# needed by FastAPI's TestClient (lives in `dev`). Shipping it in
# `[ui]` made every `pip install bettermemory[ui]` drag an extra dep
# with no runtime use.
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Property-based store invariants (tests/test_store_properties.py).
    # Pinned only on the lower bound; any reasonably modern hypothesis
    # has the strategies we use.
    "hypothesis>=6.0",
    # FastAPI's TestClient is implemented on top of httpx — needed
    # for tests/test_web.py only. Not a runtime dep of `[ui]`.
    "httpx>=0.27",
]

[project.scripts]
bettermemory = "bettermemory.server:main"

[project.urls]
# Surfaced as the "Project links" rail on PyPI — without these the
# package page has no path back to source, issues, or release notes.
Homepage = "https://github.com/0Mattias/bettermemory"
Repository = "https://github.com/0Mattias/bettermemory"
Issues = "https://github.com/0Mattias/bettermemory/issues"
Changelog = "https://github.com/0Mattias/bettermemory/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bettermemory"]

[tool.hatch.build.targets.sdist]
# Explicit exclude — hatch defaults to `git ls-files` when in a repo,
# but a release built from a clean checkout of an unindexed tree (e.g.
# a CI runner that does `git clone --filter=blob:none && uv build`)
# falls back to "everything not gitignored". These caches are not
# tracked but the gitignore alone isn't a hard guarantee; spell out
# the dev/test cruft so the sdist on PyPI stays tight and
# reproducible.
exclude = [
    ".hypothesis",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    ".coverage*",
    ".DS_Store",
    ".envrc",
    "dist",
    "venv",
    ".venv",
    "htmlcov",
]

[tool.mypy]
# Strict on the package itself — surfaces missing annotations and unused
# ignores immediately. Tests are looser: pytest fixtures and parametrize
# generate enough Any-typed scaffolding that strict-on-tests is mostly
# noise without much safety win.
files = ["src/bettermemory", "tests"]
python_version = "3.11"
strict = true
# Pydantic v2 ships its own mypy plugin for BaseModel field validation.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
# Pytest fixture composition produces a lot of "missing type arguments
# for generic dict" noise — silence it for tests only.
disable_error_code = ["type-arg", "no-untyped-def", "no-untyped-call"]

[[tool.mypy.overrides]]
# Optional extras. Without `embeddings` / `embeddings-fast` installed the
# imports are missing at type-check time; the runtime path already handles
# ImportError, returning None so the caller falls back to Jaccard / keyword.
# `httpx` is in the [dev] extra (FastAPI's TestClient depends on it) but
# `bettermemory.llm` reaches for it inside `OllamaProvider.propose()` so we
# don't crash imports on a clean install missing dev. `anthropic` / `openai`
# are runtime-optional SDKs guarded by the same lazy-import pattern.
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "fastembed",
    "fastembed.*",
    "numpy",
    "numpy.*",
    "httpx",
    "anthropic",
    "openai",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Surface DeprecationWarnings from our own code as errors. We do NOT silence
# the python-frontmatter codecs.open() deprecation — instead we vendored our
# own frontmatter handling in store.py to drop the dependency entirely.
filterwarnings = [
    "error::DeprecationWarning:bettermemory",
]
markers = [
    # Tests that assert behavior when the `embeddings` extra is *not*
    # installed (e.g. get_model() returning None on ImportError). The
    # test-embeddings CI job runs `pytest -m \"not no_extras\"` so these
    # are skipped when sentence-transformers is present.
    "no_extras: requires the embeddings extra to be absent",
    # Symmetric markers for the fastembed provider. The default test job
    # has neither extra installed; `test-embeddings` runs with only the
    # torch extra; `test-embeddings-fast` runs with only the fastembed
    # extra; a future `test-embeddings-both` job would run with both and
    # exercise the precedence rule (torch wins). Mark tests that require
    # the absence of each extra so the relevant job can deselect them.
    "no_torch_embeddings: requires the sentence-transformers extra to be absent",
    "no_fastembed: requires the fastembed extra to be absent",
]

[tool.ruff.lint.per-file-ignores]
# conftest.py does sys.path manipulation before imports as a belt-and-suspenders
# fix for the iCloud UF_HIDDEN .venv issue — see the comment in conftest.py.
"tests/conftest.py" = ["E402"]
