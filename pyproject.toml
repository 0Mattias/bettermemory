[project]
name = "bettermemory"
version = "3.25.2"
description = "Memory you can verify — a trust layer between an AI coding agent and its own past: per-hit staleness verdicts, claim-level use attribution, measured effectiveness, episodic run-state. MCP-native, local-first, MIT, no cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mattias Rask" }]
# PyPI's search index weights keywords; without them the package is
# reachable only by exact name.
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "memory",
    "agent-memory",
    "llm",
    "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "numpy>=1.24"]
# Lightweight alternative to `embeddings`: fastembed wraps ONNX Runtime
# (~50 MB on disk) instead of PyTorch (~500 MB). Same retrieval surface,
# same cache shape — different provider. When both extras are installed
# sentence-transformers wins for cache byte-stability; pick fastembed via
# `[behavior] semantic_provider = "fastembed"` when torch's footprint is
# the wrong tradeoff (CI runners, small VMs, air-gapped installs).
# fastembed wheels lag the latest Python by a release or two, so the
# `test-embeddings-fast` CI job pins to 3.13 even when the main matrix
# advances; users on 3.14 should install the standard `embeddings`
# extra until upstream catches up.
embeddings-fast = ["fastembed>=0.4", "numpy>=1.24"]
# The web UI imports `fastapi` and `uvicorn` directly — that's the
# whole runtime surface. `httpx` is *not* a runtime dep; it's only
# needed by FastAPI's TestClient (lives in `dev`). Shipping it in
# `[ui]` made every `pip install bettermemory[ui]` drag an extra dep
# with no runtime use.
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.10",
    "pyright>=1.1.400",
    "types-PyYAML>=6.0",
    # Property-based store invariants (tests/test_store_properties.py).
    # Pinned only on the lower bound; any reasonably modern hypothesis
    # has the strategies we use.
    "hypothesis>=6.0",
    # FastAPI's TestClient is implemented on top of httpx — needed
    # for tests/test_web.py only. Not a runtime dep of `[ui]`.
    "httpx>=0.27",
]

[project.scripts]
bettermemory = "bettermemory.server:main"

[project.urls]
# Surfaced as the "Project links" rail on PyPI — without these the
# package page has no path back to source, issues, or release notes.
Homepage = "https://github.com/0Mattias/bettermemory"
Repository = "https://github.com/0Mattias/bettermemory"
Issues = "https://github.com/0Mattias/bettermemory/issues"
Changelog = "https://github.com/0Mattias/bettermemory/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bettermemory"]

[tool.hatch.build.targets.sdist]
# Explicit exclude — two entry classes. Most are untracked dev/test
# caches: hatch defaults to `git ls-files` when in a repo, but a
# release built from a clean checkout of an unindexed tree (e.g. a CI
# runner that does `git clone --filter=blob:none && uv build`) falls
# back to "everything not gitignored", and the gitignore alone isn't a
# hard guarantee — spell out the cruft so the sdist on PyPI stays
# tight and reproducible. `.claude` is the highest-stakes cache:
# session scratch plus Workflow-agent worktrees — full untracked
# copies of the whole repo that must never sweep into a published
# sdist. `.envrc` is the one TRACKED entry (shared direnv config for
# the iCloud .venv workaround, ce01f40): its exclude is load-bearing
# on the default `git ls-files` path, keeping it in git but out of
# the sdist. Do NOT gitignore or `git rm --cached` it.
exclude = [
    ".hypothesis",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    ".coverage*",
    ".DS_Store",
    ".envrc",
    ".claude",
    "dist",
    "venv",
    ".venv",
    "htmlcov",
]

[tool.mypy]
# Strict on the package itself — surfaces missing annotations and unused
# ignores immediately. Tests are looser: pytest fixtures and parametrize
# generate enough Any-typed scaffolding that strict-on-tests is mostly
# noise without much safety win.
files = ["src/bettermemory", "tests"]
python_version = "3.11"
strict = true
# Pydantic v2 ships its own mypy plugin for BaseModel field validation.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
# Pytest fixture composition produces a lot of "missing type arguments
# for generic dict" noise — silence it for tests only.
disable_error_code = ["type-arg", "no-untyped-def", "no-untyped-call"]

[[tool.mypy.overrides]]
# Optional extras. Without `embeddings` / `embeddings-fast` installed the
# imports are missing at type-check time; the runtime path already handles
# ImportError, returning None so the caller falls back to Jaccard / keyword.
# `httpx` is in the [dev] extra (FastAPI's TestClient depends on it) but
# `bettermemory.llm` reaches for it inside `OllamaProvider.propose()` so we
# don't crash imports on a clean install missing dev. `anthropic` / `openai`
# are runtime-optional SDKs guarded by the same lazy-import pattern.
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "fastembed",
    "fastembed.*",
    "httpx",
    "anthropic",
    "openai",
    "mem0",
    "mem0.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy gets its OWN block (not the shared list above) because
# `ignore_missing_imports` alone does not help once numpy is actually
# installed — with the `embeddings` extra present, mypy *follows* the
# import and parses numpy 2.x's `__init__.pyi`, which uses the 3.12-only
# `type` statement. Under `python_version = "3.11"` (which MUST stay at
# the project minimum so 3.11-incompatible syntax in our own code keeps
# getting flagged) that is a hard parse error, mypy prints "errors
# prevented further checking", and it silently type-checks NOTHING.
# `follow_imports = "skip"` makes mypy treat numpy as `Any` without ever
# opening its stubs, so the run completes and actually checks the
# bettermemory package in a numpy-present env. CI's mypy job installs
# only dev+ui (no numpy) so it never hit this — but a local
# `uv sync --extra embeddings` did.
module = [
    "numpy",
    "numpy.*",
]
follow_imports = "skip"
# `follow_imports` is IGNORED for stub (`.pyi`) files by default, and numpy
# ships its types as bundled `.pyi` — so without this, mypy still opens
# numpy's `__init__.pyi` and aborts on its 3.12-only `type` statement.
# Setting this makes `follow_imports = "skip"` apply to the stubs too, so
# mypy treats numpy as `Any` without ever parsing them.
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pyright]
# Secondary type gate alongside mypy (which stays the strict primary).
# Scoped to the package: the test suite leans on dynamic pytest fixture /
# monkeypatch patterns that pyright's standard mode flags as noise with no
# safety win — the same reason the mypy config loosens `tests.*`.
include = ["src/bettermemory"]
extraPaths = ["src"]
# Type-check against the uv-managed dev venv (.venv) that both `uv run
# pyright` and CI's `uv sync --extra dev --extra ui` populate. (The repo
# also keeps a separate `venv/` for the MCP server runtime — that is NOT
# the type-check environment.)
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
# Optional runtime deps (sentence-transformers/torch, fastembed, numpy,
# anthropic, openai) are lazy-imported inside try/except ImportError and
# aren't installed in the lint env. Their import sites carry targeted
# `# pyright: ignore[reportMissingImports]`, mirroring the mypy
# `ignore_missing_imports` override above for the same modules.
#
# reportUnreachable stays off deliberately: the handlers carry
# defense-in-depth `isinstance` / None guards at the MCP-JSON boundary
# (e.g. verify.py, acknowledge_miss.py) that the static type system proves
# "unreachable" but which validate runtime input the types can't enforce.
# This matches the mypy config, which likewise does not enable
# `warn_unreachable`.
reportUnreachable = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Surface DeprecationWarnings from our own code as errors. We do NOT silence
# the python-frontmatter codecs.open() deprecation — instead we vendored our
# own frontmatter handling in store.py to drop the dependency entirely.
#
# Two lines, two axes — both are needed:
#
# - The module-scoped line keys on the module the warning is ATTRIBUTED to.
#   Our deprecations warn with stacklevel=2, attributing the warning to the
#   CALLER's frame — so it escalates deprecated-API use inside bettermemory
#   itself (src/-frame callers), but an unwrapped deprecated call made from a
#   TEST module is attributed to `tests.test_*`, never matches, and sails
#   through as a plain warning ("1 passed, 1 warning").
# - The message-scoped line closes that gap: every bettermemory deprecation
#   message contains "deprecated and will be removed in bettermemory", so it
#   escalates regardless of the caller's frame. The message field is a regex
#   matched (re.match) against str(warning) — third-party deprecation texts
#   don't name bettermemory, so they stay untouched.
#
# The fence is pinned in tests/test_origin.py ("Deprecation fence" section):
# both line literals, the regex-vs-emitted-messages match, and a subprocess
# probe proving an unwrapped test-frame call errors under this exact config.
filterwarnings = [
    "error::DeprecationWarning:bettermemory",
    "error:.*deprecated and will be removed in bettermemory:DeprecationWarning",
]
markers = [
    # Tests that assert behavior when the `embeddings` extra is *not*
    # installed (e.g. get_model() returning None on ImportError). The
    # test-embeddings CI job runs `pytest -m \"not no_extras\"` so these
    # are skipped when sentence-transformers is present.
    "no_extras: requires the embeddings extra to be absent",
    # Symmetric markers for the fastembed provider. The default test job
    # has neither extra installed; `test-embeddings` runs with only the
    # torch extra; `test-embeddings-fast` runs with only the fastembed
    # extra; a future `test-embeddings-both` job would run with both and
    # exercise the precedence rule (torch wins). Mark tests that require
    # the absence of each extra so the relevant job can deselect them.
    "no_torch_embeddings: requires the sentence-transformers extra to be absent",
    "no_fastembed: requires the fastembed extra to be absent",
]

[tool.ruff.lint.per-file-ignores]
# conftest.py does sys.path manipulation before imports as a belt-and-suspenders
# fix for the iCloud UF_HIDDEN .venv issue — see the comment in conftest.py.
"tests/conftest.py" = ["E402"]
