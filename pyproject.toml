[project]
name = "memory-mcp"
version = "0.1.0"
description = "Local file-backed memory MCP server with retrieval-on-demand"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "memory-mcp contributors" }]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "python-frontmatter>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "numpy>=1.24"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "ruff>=0.1"]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
