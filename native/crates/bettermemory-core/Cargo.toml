[package]
name = "bettermemory-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "bettermemory 9 native core: canonical JSON, datetime, Unicode, lexicon, signed log"

[dependencies]
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "limits", "hooks"] }
getrandom = { version = "=0.4.3", default-features = false }
zlib-rs = { version = "=0.6.8", default-features = false, features = ["rust-allocator"] }
bettermemory-sys = { path = "../bettermemory-sys" }

[dev-dependencies]
serde_json = { version = "=1.0.151" }
