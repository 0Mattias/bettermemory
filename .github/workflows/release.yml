name: Release

# Two ways to fire this workflow:
#
# 1. Push a `v<X.Y.Z>` tag — builds, runs the full gating suite, publishes
#    to PyPI via trusted publishing, and creates a GitHub release with
#    auto-generated notes.
#
# 2. Manually trigger via the Actions tab (workflow_dispatch) — useful for
#    publishing to TestPyPI ahead of the real release, so you can verify
#    the rendered project page and the install path before committing.
#
# Trusted publishing is configured per-target on the PyPI side (see
# `docs/release.md`); no API tokens live in repo secrets.
#
# Every run that passes the gates also signs build provenance for the files
# it built (the `provenance` job), and a tag run attaches `SHA256SUMS`, plus
# the CycloneDX SBOM where `tools/sbom.py` exists in the tagged tree, to the
# GitHub release beside the wheel and the sdist. None of it sits on the path
# to PyPI: the only new steps before the publish are the build job's
# `sha256sum` and the upload of its output, beside the upload of the files.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  # Gate the whole release on the FULL CI matrix — every job in ci.yml
  # (ubuntu 3.11-3.14 + macOS + Windows + pyright), invoked as a
  # reusable workflow against the tagged commit.
  # The publish jobs below `needs:` this, so the immutable PyPI publish
  # cannot fire unless the entire matrix is green. Previously the publish
  # depended only on `build` (the core Linux gate), so a macOS/Windows-
  # only failure could not block a publish.
  ci:
    name: Full CI matrix
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Left in the checkout's git config, the
          # token would be readable by every later step, the test suite too.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # This job builds the files PyPI receives, so it restores nothing an
          # earlier run wrote: a poisoned cache entry would reach the
          # environment the build runs in. setup-uv's default is `auto`, which
          # caches, so the switch is spelled out rather than the line dropped.
          enable-cache: false

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Resolve version and verify it matches the tag
        id: version
        # On a tag push (`refs/tags/v1.2.3`), the pyproject.toml version
        # must match the tag — otherwise we'd ship a wheel labelled with
        # the wrong version. workflow_dispatch builds skip the match
        # check (no tag to match against).
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pyproject version: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tag version:       $TAG_VERSION"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::pyproject.toml version ($VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
          fi

      - name: Check the tag's version has a CHANGELOG section
        # The section the github-release job prints as the release notes.
        # A tag whose version has no section, or an empty one, fails here,
        # and publish-pypi needs this job, so nothing reaches PyPI for it.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/changelog_section.py CHANGELOG.md "$VERSION" > /dev/null

      - name: Sync dependencies
        # Mirrors the main CI matrix — the release build should exercise
        # the same surface CI does.
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=bettermemory --cov-report=term-missing --cov-fail-under=80 -q

      - name: Build distributions
        run: uv build

      - name: Write the checksums
        # Over exactly the files `uv build` wrote, each named as the GitHub
        # release attaches it, so `sha256sum -c SHA256SUMS` runs unchanged
        # beside the downloaded files. The file lands in dist-extra/, never
        # in dist/: the publish jobs upload every file in dist/ to PyPI. The
        # glob skips the `.gitignore` uv writes into dist/, as the artifact
        # upload below does.
        run: |
          mkdir -p dist-extra
          (cd dist && export LC_ALL=C && sha256sum -- *) > dist-extra/SHA256SUMS
          cat dist-extra/SHA256SUMS

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload the checksums
        # An artifact of its own, so the `dist` artifact the publish jobs
        # download stays exactly the files `uv build` wrote.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-extra
          path: dist-extra/
          if-no-files-found: error

  # Signed SLSA build provenance for the wheel and the sdist, kept in
  # GitHub's attestation store against this repository, so
  # `gh attestation verify <file> -R 0Mattias/bettermemory` ties a file to
  # this workflow and the commit it built. It waits for the same gates as
  # the publish jobs and runs beside them. Nothing on the PyPI path needs
  # it, so a Sigstore or attestation-API outage turns the run red without
  # holding the publish back. A red tag run also skips the MCP registry
  # listing (publish-mcp.yml lists after a successful run only); re-running
  # the failed job, or a dispatch of that workflow, recovers it. A dispatch
  # of this workflow attests its TestPyPI build too, which is how the job
  # is exercised ahead of a tag.
  provenance:
    name: Attest build provenance
    needs: [build, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Sigstore issues the signing certificate against.
      id-token: write
      # Stores the signed attestation against this repository.
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-extra
          path: dist-extra/

      - name: Check the files against the build job's checksums
        run: cd dist && sha256sum --check --strict ../dist-extra/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build, ci]
    # Tag push goes straight to PyPI; workflow_dispatch with target=pypi
    # is the manual-promotion escape hatch.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    # NOTE: this names a GitHub environment for the OIDC trust binding and
    # the deployment URL — it is NOT an approval gate. As of 7.17.3 the
    # `pypi` environment has `protection_rules: []` and
    # `deployment_branch_policy: null`, so nothing here pauses for a human
    # or restricts which ref may publish. Add required reviewers or a
    # branch policy in Settings → Environments if you want that; until
    # then the SHA pin on the publish step below is the real control.
    environment:
      name: pypi
      url: https://pypi.org/p/bettermemory
    permissions:
      # Required for PyPI trusted publishing (OIDC token exchange).
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, ci]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bettermemory
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history so auto-generated release notes can compute
          # the changelog window from the previous tag.
          fetch-depth: 0
          # The release is made through the API with the job's token, so git
          # needs no credential. Kept out of the checkout's git config, the
          # token that can write to the repository is out of the scripts'
          # reach below.
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-extra
          path: dist-extra/

      - name: Check the files against the build job's checksums
        # The release attaches the bytes the build job hashed, which are the
        # bytes PyPI received from the same artifact.
        run: cd dist && sha256sum --check --strict ../dist-extra/SHA256SUMS

      - name: Write the SBOM
        # A CycloneDX SBOM of the locked dependency set, from tools/sbom.py
        # where the tagged tree has it; a tree without the script skips the
        # step and the release carries the checksums alone. It runs here,
        # after the publish, so the script cannot hold a release back from
        # PyPI. The script writes a timestamp only when SOURCE_DATE_EPOCH is
        # set, and none is set here, so the same command over the tag
        # reproduces the attached file.
        if: hashFiles('tools/sbom.py') != ''
        run: python3 tools/sbom.py --lock uv.lock --out dist-extra/bettermemory.cdx.json

      - name: Read the tag's kind
        id: kind
        # A tag whose version carries a letter after the digits (`v9.0.0rc1`,
        # `v9.0.0b1`, `v9.0.0.dev1`) is a pre-release in PEP 440 terms: pip and
        # uv skip it unless asked for it by version, so the GitHub release is
        # marked the same way and stays off the "latest" slot.
        run: |
          if [[ "${GITHUB_REF_NAME#v}" =~ [A-Za-z] ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is a pre-release tag"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is a release tag"
          fi

      - name: Write the release notes from the CHANGELOG
        # The version's section, printed by tools/changelog_section.py (its
        # tests are tests/test_changelog_section.py); the build job checked
        # it exists before anything was published. GitHub's generated notes,
        # the compare link, follow it in the body. The tool cuts a section
        # over 120,000 characters at a paragraph boundary with a note, since
        # GitHub refuses a body over 125,000 and this job runs after the
        # PyPI publish.
        run: |
          python3 tools/changelog_section.py CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md
          wc -c release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          files: |
            dist/*
            dist-extra/*
