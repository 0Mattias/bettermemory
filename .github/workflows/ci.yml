name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Experimental jobs (currently py3.15) report failures in the matrix
    # view but don't block the overall CI status. The pre-release ecosystem
    # is the bottleneck, not us — see the python-version comment below.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out as include entries (rather than os × python-version
        # cross + extra includes) so each slot can carry an `experimental`
        # flag without GitHub Actions' awkward matrix-overlay rules.
        #
        # 3.15 is still pre-release (Oct 2026 final). uv resolves the bare
        # "3.15" spec to the latest python-build-standalone build, which
        # tracks the upstream RCs — but pydantic-core's prebuilt wheels for
        # 3.15 only land once it ships a release built on PyO3 ≥ 0.28
        # (PyO3 0.27.x caps at 3.14). Until then, ubuntu/macos 3.15 fall
        # back to a source build and fail; Windows happens to have wheels
        # earlier. Mark 3.15 jobs experimental so the matrix surfaces the
        # state without blocking merges. Drop `experimental: true` once
        # `uv sync` succeeds on 3.15 across all three OSes.
        #
        # Platform coverage rationale (why mac + win at all):
        #   - platformdirs returns different paths per OS
        #   - fcntl file locking in store.py / events.py is POSIX-only;
        #     Windows runs the no-op fallback
        #   - conftest.py works around macOS UF_HIDDEN in iCloud-synced
        #     dirs
        # 3.11 is the pyproject floor; we keep it pinned to ubuntu only.
        include:
          - {os: ubuntu-latest,  python-version: "3.11"}
          - {os: ubuntu-latest,  python-version: "3.12"}
          - {os: ubuntu-latest,  python-version: "3.13"}
          - {os: ubuntu-latest,  python-version: "3.14"}
          - {os: ubuntu-latest,  python-version: "3.15", experimental: true}
          - {os: macos-latest,   python-version: "3.14"}
          - {os: macos-latest,   python-version: "3.15", experimental: true}
          - {os: windows-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.15", experimental: true}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=bettermemory --cov-report=term-missing --cov-fail-under=80 -q

  test-embeddings:
    name: test (embeddings extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pinned to 3.14 (current stable): sentence-transformers + torch
      # wheels lag the Python release cadence, so chasing 3.15 here just
      # means falling back to source builds and breaking CI for reasons
      # unrelated to bettermemory.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies (with embeddings extra)
        run: uv sync --extra dev --extra embeddings

      # The "no_extras" marker covers the three tests in test_semantic.py
      # that assert the extras are *absent*. Skipping them in this job
      # leaves the rest of the suite — including the cosine-similarity
      # paths — running against a real sentence-transformers install,
      # which is otherwise never exercised in CI.
      - name: Test (skipping no_extras-marked tests)
        run: uv run pytest -m "not no_extras" -q
