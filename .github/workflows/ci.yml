name: CI

on:
  push:
    branches: [main, v9]
  pull_request:
    branches: [main]
  # Callable as a reusable workflow so release.yml can gate the PyPI
  # publish on the FULL matrix (macOS/Windows + pyright), not just the
  # core Linux gate. Additive: push/PR runs are unchanged.
  workflow_call:
  # Manual re-fire for dropped events. During the 2026-08-06 GitHub
  # partial outage the push event for a release-gating commit was never
  # delivered to Actions, and with only push/PR triggers the sole
  # remedy was an empty commit. `gh workflow run CI --ref main` is the
  # honest version of that: same matrix, same gate, no history noise.
  workflow_dispatch:
    # The membership legs below run on a dispatch only when this is ticked;
    # under workflow_call it is never set, so release.yml's gate skips them.
    inputs:
      membership_legs:
        description: "Also run the membership legs (docker, NFS, SMB)"
        type: boolean
        default: false
      # The `repeat` job below runs on a dispatch that names a test; like
      # the membership legs, it never runs under workflow_call.
      repeat_test:
        description: "Also run this test (a pytest node id) alone, repeat_runs times"
        type: string
        default: ""
      repeat_runs:
        description: "How many times the repeat job runs repeat_test"
        type: number
        default: 30
      repeat_os:
        description: "The runner the repeat job uses"
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest]
        default: windows-latest

permissions:
  contents: read

# Every checkout sets `persist-credentials: false`. No step after a checkout
# here pushes or fetches, and actions/checkout otherwise leaves the token in
# the checkout's git config for the rest of the job, where every later step,
# the test suite included, can read it. tests/test_workflow_policy.py holds
# every workflow to this rule, to SHA-pinned actions and to job-scoped write
# permissions.

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # `experimental` is wired up so we can re-add pre-release Pythons
    # later without having to rebuild the workflow scaffolding around
    # `continue-on-error`. None of the current entries set it.
    #
    # RELEASE-GATE CAVEAT: this workflow is reused by release.yml to gate
    # the PyPI publish on the full matrix. A leg that sets
    # `experimental: true` is `continue-on-error`, so its failure will
    # NOT fail the `test` job, NOT fail this reusable workflow, and
    # therefore NOT block the publish — it is silently exempt from the
    # "publish only on a fully-green matrix" contract release.yml relies
    # on. Before adding any `experimental` leg, decide deliberately:
    # either it must NOT gate releases (current behavior — fine for a
    # genuinely pre-release Python), or move it to a separate
    # non-reusable job so the publish gate stays honest.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out as include entries (rather than os × python-version
        # cross + extra includes) so each slot can carry an `experimental`
        # flag without GitHub Actions' awkward matrix-overlay rules.
        #
        # py3.15 is intentionally absent. Two failure modes blocked it:
        #   - pydantic-core / rpds-py ship with PyO3 0.27.x, which caps
        #     at Python 3.14. uv falls back to a source build and the
        #     compile rejects 3.15.
        #   - PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 (PyO3's documented
        #     workaround) pulls in PyO3 0.28, but pydantic-core 2.46.4's
        #     source uses #[pyclass(extends=PyTzInfo)] which abi3 mode
        #     doesn't allow ("PyO3 does not support subclassing native
        #     types").
        # Both directions need an upstream pydantic-core release built
        # on PyO3 ≥ 0.28 without abi3-incompatible subclassing. Until
        # that ships, py3.15 has no path to passing — there's nothing
        # we can do from here, so we don't pretend by carrying a red
        # experimental slot. Re-add the entries once a compatible
        # pydantic-core release lands.
        #
        # Platform coverage rationale (why mac + win at all):
        #   - platformdirs returns different paths per OS
        #   - fcntl file locking in store.py / events.py is POSIX-only;
        #     Windows runs the no-op fallback
        #   - conftest.py works around macOS UF_HIDDEN in iCloud-synced
        #     dirs
        # 3.11 is the pyproject floor; we keep it pinned to ubuntu only.
        include:
          - {os: ubuntu-latest,  python-version: "3.11"}
          - {os: ubuntu-latest,  python-version: "3.12"}
          - {os: ubuntu-latest,  python-version: "3.13"}
          - {os: ubuntu-latest,  python-version: "3.14"}
          - {os: macos-latest,   python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=bettermemory --cov-report=term-missing --cov-fail-under=80 -q

      # The UNC (\\localhost\C$\...), verbatim (\\?\C:\...) and device
      # (\\.\C:\...) path opens in tests/test_sqlite_uri.py run only on
      # Windows, at four sites each (store, posture, backup, daemon), and the
      # UNC case skips where the runner's admin share does not answer. The
      # suite above runs them under -q, which counts a skip and drops its
      # reason. This step runs the file again with -v and -rs, so the log
      # holds one PASSED or SKIPPED line per test, then a "short test
      # summary info" block with a line per skip reason (n tests skipped
      # with it),
      #   SKIPPED [n] tests/test_sqlite_uri.py:<line>: <reason>
      # Every Windows host skips two POSIX-only cases ("a //server path on
      # Windows is a network lookup", "'?' cannot be in a Windows file
      # name"); the UNC case is listed only if "the admin share does not
      # answer here: <error>", and the server-authority case only if "this
      # SQLite passes a URI's authority on as a UNC name". The last line is
      # "N passed, M skipped". The step runs when the suite above failed
      # too, so a red leg still says which of the path tests ran.
      - name: Windows path tests (UNC, verbatim and device paths)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: uv run pytest -p no:cacheprovider -v -rs tests/test_sqlite_uri.py

  install-from-constraints:
    name: install from declared constraints
    runs-on: ubuntu-latest
    # Every other job in this file installs through `uv sync --locked`,
    # which fails rather than re-resolving when the committed `uv.lock`
    # has drifted from `pyproject.toml`. (`--locked` since 7.17.3; the
    # bare form this comment used to describe silently REGENERATED the
    # lock in the runner, which also left `tests/test_version.py`'s
    # lockfile guard comparing the regenerated file to itself — release
    # d555025 shipped pyproject 6.2.0 against a 6.1.0 lock self-entry
    # with every leg green.) That is the right thing for
    # reproducible test runs and the wrong thing for answering the only
    # question a user actually asks: "does `pip install bettermemory`
    # work today?" The lock pins a resolution that was valid when it was
    # written; `[project.dependencies]` is the contract new installs
    # resolve against, and nothing verified it.
    #
    # It failed silently for exactly that reason. `mcp>=1.0.0` was
    # unbounded when mcp 2.0.0 deleted `mcp.server.fastmcp`, so 3.31.0
    # shipped to PyPI dead on arrival while all nine CI legs stayed
    # green (postmortem:
    # docs/incidents/2026-07-31-mcp-2-unbounded-constraint.md).
    #
    # So this job deliberately does NOT use the lockfile. That single
    # omission is what makes it a forward alarm: resolving the declared
    # constraints afresh takes the newest allowed version of every
    # dependency, so the next upstream major that breaks us fails here,
    # on a normal push, instead of on a user's machine after a release.
    # It follows that this job can go red without any local change —
    # that is the design, and the fix is a considered constraint edit
    # (or a port), never deleting the job.
    #
    # `--resolution highest` below is uv's own default, spelled out
    # rather than relied upon: it is the behaviour this job's whole
    # premise rests on, so a future `[tool.uv]` setting or changed
    # default must not be able to quietly turn the alarm off. It is
    # belt-and-braces, NOT the mechanism — and it says nothing about
    # cache freshness, which uv governs separately via `--refresh`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # A bare venv + `uv pip install .` — no `uv sync`, no `uv.lock`,
      # no extras. This is the default install a new user gets.
      - name: Install from declared constraints (no lockfile)
        run: |
          uv venv --python 3.13 /tmp/constraint-venv
          uv pip install --python /tmp/constraint-venv/bin/python \
            --resolution highest .

      - name: Show resolved dependency versions
        # Printed unconditionally so a future red run says WHICH upstream
        # moved without anyone having to reproduce it locally.
        run: uv pip list --python /tmp/constraint-venv/bin/python

      # The import is the whole point: the mcp 2.0.0 breakage was a
      # module-level `ModuleNotFoundError`, so merely resolving and
      # installing cleanly would still have shipped it. `build_server()`
      # goes one step further and exercises the SDK surface we actually
      # call (tool registration), which is where a subtler upstream
      # change would land. `BETTERMEMORY_DIR` keeps it hermetic — the
      # smoke test must not depend on, or create, a real user store.
      - name: Smoke test (import + build the server + CLI entry point)
        env:
          BETTERMEMORY_DIR: /tmp/constraint-smoke-store
        run: |
          /tmp/constraint-venv/bin/python -c "
          import bettermemory
          from bettermemory import build_server
          build_server()
          print('import + build_server OK:', bettermemory.__version__)
          "
          /tmp/constraint-venv/bin/bettermemory --version

  typecheck-pyright:
    name: type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        # The `[tool.pyright]` config pins `venv = ".venv"`, which
        # `uv sync` populates here.
        run: uv sync --locked --extra dev

      - name: Pyright
        run: uv run pyright

  # The git-reading suites against git built from its source (ENG-227): the
  # oldest release bettermemory supports (`gitversion.MINIMUM`) and the
  # newest. Every other leg runs them against the runner's own git. Each
  # build is kept in the cache under its archive's SHA-256 and the build
  # script's digest, at the same path under the runner's temp directory,
  # where git finds its own programs. docs/operations.md, "Supported git",
  # says how the minimum was chosen. The suites are the files whose tests
  # run git, or read what it would; a test whose premise is a newer git's
  # behaviour is gated on the release or on what the git does.
  git-releases:
    name: git ${{ matrix.git }} (built from source)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {git: v2.34.8, sha256: e5feb1628fa99c65e21abff062aa52104127c57626ac97c3f92f9844b4eef092}
          - {git: v2.56.0, sha256: d761232b81394f7d4c3ef1a99fa804ffbe10d278ae1ad302833a0892050ca9fc}
    env:
      GIT_REF: ${{ matrix.git }}
      GIT_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Restore the git build
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-${{ matrix.git }}
          key: git-${{ runner.os }}-${{ matrix.git }}-${{ matrix.sha256 }}-${{ hashFiles('tools/ci/build_git.sh') }}

      - name: Build git
        if: steps.build.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zlib1g-dev
          bash tools/ci/build_git.sh "$GIT_REF" "$RUNNER_TEMP/git-$GIT_REF" "$GIT_SHA256"

      - name: Keep the git build
        if: steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-${{ matrix.git }}
          key: ${{ steps.build.outputs.cache-primary-key }}

      - name: Put the built git first on PATH
        run: echo "$RUNNER_TEMP/git-$GIT_REF/bin" >> "$GITHUB_PATH"

      # The suites below run whatever git is first on PATH: this one, or
      # the step fails.
      - name: Show the git the suites run
        run: |
          command -v git
          git version
          git version | grep -Fx "git version ${GIT_REF#v}"

      - name: Git-reading suites
        run: >-
          uv run pytest -p no:cacheprovider -q -rfE
          tests/test_origin*.py tests/test_verify*.py tests/test_claims.py
          tests/test_location*.py tests/test_git*.py tests/test_membership*.py
          tests/test_posture*.py tests/test_commit_drift_cache.py
          tests/test_checkout_token.py tests/test_repository_setting_refusals.py
          tests/test_native_path_end_to_end.py tests/test_native_workspace_transport.py
          tests/test_home_commit_leg.py tests/test_moved_commit_anchors.py
          tests/test_remoteless_verified_head.py tests/test_unread_history.py
          tests/test_sparse_config_spellings.py tests/test_health_rollup_ownership.py
          tests/test_historical_path_types.py tests/test_ancestry_read_errors.py
          tests/test_spaced_translated_anchor.py
          tests/test_server_commit_drift.py
          tests/test_health_root_rotation.py
          tests/test_git_read_budget.py tests/test_home_read_budget.py
          tests/test_show_read_budget.py tests/test_health_read_budget.py
          tests/test_literal_attestation_mcp.py
          tests/test_bench_live_census.py tests/test_bench_rot.py

  # The same suites against git's `next` built with its breaking changes, as
  # git 3.0 will be (ENG-227). `next` moves, so its commit is read each run
  # and named in the log, and no digest can be pinned. The job may fail: a
  # change in `next` is no fault of this checkout, and no release waits on
  # it (the RELEASE-GATE caveat above). A failure of the suites is reported
  # as a warning and in the step summary, and the job stays green.
  git-next:
    name: git next (WITH_BREAKING_CHANGES, may fail)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Find next's commit
        id: next
        run: |
          sha=$(git ls-remote https://github.com/git/git refs/heads/next | cut -f1)
          test -n "$sha"
          echo "::notice title=git next::building git next at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore the git build
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-next
          key: git-${{ runner.os }}-next-breaking-${{ steps.next.outputs.sha }}-${{ hashFiles('tools/ci/build_git.sh') }}

      - name: Build git
        if: steps.build.outputs.cache-hit != 'true'
        env:
          NEXT_SHA: ${{ steps.next.outputs.sha }}
          BUILD_GIT_MAKEFLAGS: WITH_BREAKING_CHANGES=YesPlease
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zlib1g-dev
          bash tools/ci/build_git.sh "$NEXT_SHA" "$RUNNER_TEMP/git-next"

      - name: Keep the git build
        if: steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-next
          key: ${{ steps.build.outputs.cache-primary-key }}

      - name: Put the built git first on PATH
        run: echo "$RUNNER_TEMP/git-next/bin" >> "$GITHUB_PATH"

      - name: Show the git the suites run
        run: |
          command -v git
          git version
          test "$(command -v git)" = "$RUNNER_TEMP/git-next/bin/git"

      - name: Git-reading suites
        id: suites
        continue-on-error: true
        run: |
          set +e
          uv run pytest -p no:cacheprovider -q -rfE --tb=no \
            tests/test_origin*.py tests/test_verify*.py tests/test_claims.py \
            tests/test_location*.py tests/test_git*.py tests/test_membership*.py \
            tests/test_posture*.py tests/test_commit_drift_cache.py \
            tests/test_checkout_token.py tests/test_repository_setting_refusals.py \
            tests/test_native_path_end_to_end.py tests/test_native_workspace_transport.py \
            tests/test_home_commit_leg.py tests/test_moved_commit_anchors.py \
            tests/test_remoteless_verified_head.py tests/test_unread_history.py \
            tests/test_sparse_config_spellings.py tests/test_health_rollup_ownership.py \
            tests/test_historical_path_types.py tests/test_ancestry_read_errors.py \
            tests/test_spaced_translated_anchor.py \
            tests/test_health_root_rotation.py \
            tests/test_git_read_budget.py tests/test_home_read_budget.py \
            tests/test_show_read_budget.py tests/test_health_read_budget.py \
            tests/test_server_commit_drift.py tests/test_literal_attestation_mcp.py \
            tests/test_bench_live_census.py tests/test_bench_rot.py > "$RUNNER_TEMP/next-suites.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/next-suites.txt"
          exit "$status"

      - name: Report the suites' failures
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        env:
          NEXT_SHA: ${{ steps.next.outputs.sha }}
        run: |
          failed=$(grep -cE '^(FAILED|ERROR) ' "$RUNNER_TEMP/next-suites.txt" || true)
          echo "::warning title=git next::$failed of the git-reading suites' tests fail against git next $NEXT_SHA built with breaking changes; the step summary lists them"
          {
            echo "### git next $NEXT_SHA (WITH_BREAKING_CHANGES)"
            echo
            echo '```'
            grep -E '^(FAILED|ERROR) |passed|failed' "$RUNNER_TEMP/next-suites.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"



  commit-lint:
    name: commit messages
    runs-on: ubuntu-latest
    # Not on manual dispatch: `github.event.before` exists only on push
    # events, so a dispatch run's RANGE degraded to `..<sha>` — the
    # EMPTY range — and the job passed having graded zero commits while
    # looking like it graded the tree. A dispatch re-fires the matrix
    # for a dropped push event; its commits were graded on their
    # original push, so the honest shape is a visible skip, not a
    # hollow green.
    if: github.event_name != 'workflow_dispatch'
    steps:
      # `fetch-depth: 0` is required: the linter grades a RANGE, and the
      # default shallow clone has neither the base commit nor the
      # intermediate commits of a multi-commit push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only the commits this event introduces are graded. History before
      # the rules landed was written under the older, looser guidance and
      # re-grading it would fail every run forever with nothing anyone can
      # fix. On a first push to a new branch `event.before` is all zeroes
      # and the range will not resolve — the linter reports that and exits
      # 0 rather than blocking on an unfixable condition.
      - name: Lint commit messages
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}',
                          github.event.pull_request.base.sha,
                          github.event.pull_request.head.sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: python3 tools/commit_lint.py --range "$RANGE"

  # The previous published release against this checkout (ENG-107): an
  # old shim, hook and CLI paired with this checkout's daemon and store,
  # and this checkout's daemon and store with the old ones, across a
  # candidate boundary. tests/test_shim_versions.py and
  # tests/test_cross_build.py stand the other build in with this build's
  # own code; here it is the release a user has installed, from PyPI.
  #
  # The release is the newest on PyPI in this major at or below the
  # checkout's version, other than the one a tag on this commit names, so
  # a release's own tag meets the release before it. PyPI is the source,
  # not the tags: some tags were never published. It installs as of its
  # wheel's upload (`--exclude-newer`), with the dependencies it had then.
  # Between releases the checkout carries the newest release's version,
  # and two equal versions are one build to the daemon and its clients,
  # so the checkout is then built as the next candidate, from a copy;
  # nothing is edited in the checkout. No earlier release in the major
  # (a new major's first candidate) skips the job with a notice.
  #
  # `fetch-depth: 0` so `git tag --points-at HEAD` sees the tags. Every
  # child of the test runs in a sandbox under its tmp_path; the test
  # checks where each build resolves its store, keys, config and state
  # before it starts a daemon.
  #
  # tests/test_cross_release_exchange.py runs the previous release's hook
  # client over the witness exchange (design 8.7) against this checkout's
  # daemon, a tie past the traversal's bound and a declared folder: each
  # client step is tools/ci/container_client.py under the previous
  # release's interpreter, and the daemon's half is this checkout's
  # resolve_hook in the test's process.
  cross-release:
    name: cross-release (previous release against this checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      # Prints version, uploaded, exclude_newer and build, or nothing.
      - name: Find the previous release
        id: previous
        run: |
          python3 tools/ci/previous_release.py > "$RUNNER_TEMP/previous-release.txt"
          cat "$RUNNER_TEMP/previous-release.txt"
          cat "$RUNNER_TEMP/previous-release.txt" >> "$GITHUB_OUTPUT"

      - name: No earlier release in this major
        if: steps.previous.outputs.version == ''
        run: >-
          echo "::notice title=cross-release::PyPI holds no earlier release of
          this major; nothing to cross"

      - name: Sync dependencies
        if: steps.previous.outputs.version != ''
        run: uv sync --locked --extra dev

      - name: Make the two installs
        id: builds
        if: steps.previous.outputs.version != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
          EXCLUDE_NEWER: ${{ steps.previous.outputs.exclude_newer }}
          BUILD: ${{ steps.previous.outputs.build }}
        run: |
          python3 tools/ci/cross_release_builds.py --previous "$PREVIOUS" \
            --exclude-newer "$EXCLUDE_NEWER" --build "$BUILD" --python 3.13 \
            "$RUNNER_TEMP/cross-release" > "$RUNNER_TEMP/cross-release.txt"
          cat "$RUNNER_TEMP/cross-release.txt"
          cat "$RUNNER_TEMP/cross-release.txt" >> "$GITHUB_OUTPUT"

      - name: Cross-release tests
        if: steps.previous.outputs.version != ''
        env:
          BETTERMEMORY_CI_PREVIOUS: ${{ steps.builds.outputs.BETTERMEMORY_CI_PREVIOUS }}
          BETTERMEMORY_CI_NEXT: ${{ steps.builds.outputs.BETTERMEMORY_CI_NEXT }}
        run: >-
          uv run pytest -p no:cacheprovider -rA tests/test_cross_release.py
          tests/test_cross_release_exchange.py

  # The membership legs (RS-F6, design 8.7, plan phase 7): the
  # environments the design argued, run for real on ubuntu-latest. Each
  # runs on a dispatch of this workflow with `membership_legs` ticked or on
  # a push to main or v9, never on a pull request, so the owner runs them
  # on his word. release.yml's gate is unchanged: under workflow_call the
  # github context is the caller's (a tag push, or a dispatch of the
  # release), and `inputs` holds only workflow_call inputs, so
  # `inputs.membership_legs` is unset there and both release paths skip
  # these legs.
  membership-docker:
    name: membership in containers (docker, E10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.membership_legs)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v9'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Show the docker engine
        run: |
          docker version
          docker info --format 'storage driver {{.Driver}}, kernel {{.KernelVersion}}, {{.OperatingSystem}}'

      # I39 to I42: the test builds tools/ci/Dockerfile, runs every
      # container with --network none as the runner's uid, prints each
      # container's `mount | grep` and `stat` lines (-rA shows them for a
      # passed test), and removes its image and containers. On Linux a bind
      # mount keeps the host's device and inode; the container is still a
      # machine of its own.
      - name: Membership tests in containers
        env:
          BETTERMEMORY_CI_DOCKER: "1"
        run: uv run pytest -p no:cacheprovider -rA tests/test_membership_container.py

  membership-nfs:
    name: membership on NFSv3 (loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.membership_legs)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v9'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Export a loopback directory over NFSv3 and mount it
        run: sudo bash tools/ci/nfs_export.sh "$(id -u)" "$(id -g)"

      # NFSv3 carries no birth time: the stat shows "Birth: -".
      - name: Show the mount
        run: bash tools/ci/show_mount.sh /mnt/nfs

      # --basetemp puts every tmp_path on the mount: E11, E15, E19, E20 and
      # E33 with the repositories, checkout tokens and project files on NFS.
      # The stores, their keys and the machines' state directories are on
      # the runner's own disk (BETTERMEMORY_TEST_LOCAL_TMP, the conftest's
      # local_tmp_path): SQLite's WAL needs shared memory a network
      # filesystem does not give, and the leg tests the repositories, not
      # the store.
      # The concurrent re-mints test runs 300 rounds here and on SMB, not
      # 30 (BETTERMEMORY_TEST_REMINT_ROUNDS): a claim a release left was
      # seen on SMB once in 19 runs of 30 (ENG-228).
      - name: Membership tests on NFS
        env:
          BETTERMEMORY_TEST_LOCAL_TMP: ${{ runner.temp }}/bettermemory-local
          BETTERMEMORY_TEST_REMINT_ROUNDS: "300"
        run: >-
          uv run pytest -p no:cacheprovider --basetemp=/mnt/nfs/pytest -q -rfEs
          tests/test_checkout_token.py tests/test_project_file.py
          tests/test_gitobjects.py tests/test_membership_capture.py
          tests/test_membership_resolution.py

      # Every membership and location test file, read as a filesystem
      # without birth time reads them (BETTERMEMORY_TEST_NO_BIRTH),
      # everything on the runner's ext4, which hands a freed inode number
      # straight back to the next file: E15 where the number does come
      # back. It runs whatever the NFS step above gave, and more: the
      # files on NFS are the ones whose repositories that step mounts,
      # these are every file that reads an object. Globs, not a list:
      # two files the list left out hid three failures here (ENG-193).
      - name: Membership tests without birth time on the runner's disk
        if: ${{ !cancelled() }}
        env:
          BETTERMEMORY_TEST_NO_BIRTH: "1"
        run: >-
          uv run pytest -p no:cacheprovider
          --basetemp=${{ runner.temp }}/pytest-no-birth -q -rfEs
          tests/test_checkout_token.py tests/test_project_file.py
          tests/test_gitobjects.py tests/test_membership*.py
          tests/test_location*.py

  membership-smb:
    name: membership on SMB 3.0 (loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.membership_legs)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v9'))
    env:
      # The share's Samba user, made by the job on a throwaway runner and
      # reachable on its loopback only: not a secret of the repository.
      BM_SMB_USER: bmci
      BM_SMB_PASSWORD: bmci-loopback-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Share a loopback directory over SMB 3.0 and mount it
        id: share
        run: >-
          sudo bash tools/ci/smb_share.sh setup "$(id -u)" "$(id -g)"
          "$BM_SMB_USER" "$BM_SMB_PASSWORD"

      - name: Show the mount
        run: bash tools/ci/show_mount.sh /mnt/smb

      # --basetemp puts every tmp_path on the mount: the repositories,
      # checkout tokens and project files on SMB. The stores, their keys
      # and the machines' state directories are on the runner's own disk
      # (BETTERMEMORY_TEST_LOCAL_TMP), as are the few fixtures the share
      # cannot host and that test the reader, not the mount: a FIFO
      # (EOPNOTSUPP) and a file chmod makes unreadable (chmod 000 does not
      # take on the share). The cifs client reports its own write time for
      # a file it wrote until its attribute cache expires (actimeo=1) and
      # the data is flushed (closetimeo=1), the server's time afterwards:
      # a test that records a new file's times and reads them again after
      # a move waits them out (BETTERMEMORY_TEST_SETTLE_SECONDS).
      - name: Membership tests on SMB
        env:
          BETTERMEMORY_TEST_LOCAL_TMP: ${{ runner.temp }}/bettermemory-local
          BETTERMEMORY_TEST_SETTLE_SECONDS: "3"
          BETTERMEMORY_TEST_REMINT_ROUNDS: "300"
        run: >-
          uv run pytest -p no:cacheprovider --basetemp=/mnt/smb/pytest -q -rfEs
          tests/test_checkout_token.py tests/test_project_file.py
          tests/test_gitobjects.py tests/test_membership_capture.py
          tests/test_membership_resolution.py

      # E11 c: a remount can renumber objects. The first mount takes the
      # server's inode numbers (serverino), so a remount with the same
      # options keeps every object; the remount adds noserverino, so the
      # client numbers the inodes itself and the second mount renumbers
      # them. The step prints one file's device and inode before and after;
      # the token tests then run again on the remounted share. Both run
      # whenever the share was mounted, so a failure above still leaves the
      # remount in the log.
      - name: Unmount and mount the share again
        if: ${{ !cancelled() && steps.share.outcome == 'success' }}
        run: >-
          sudo bash tools/ci/smb_share.sh remount "$(id -u)" "$(id -g)"
          "$BM_SMB_USER" "$BM_SMB_PASSWORD"

      - name: Show the mount after the remount
        if: ${{ !cancelled() && steps.share.outcome == 'success' }}
        run: bash tools/ci/show_mount.sh /mnt/smb

      - name: Checkout token tests on the remounted share
        if: ${{ !cancelled() && steps.share.outcome == 'success' }}
        env:
          BETTERMEMORY_TEST_LOCAL_TMP: ${{ runner.temp }}/bettermemory-local
          BETTERMEMORY_TEST_REMINT_ROUNDS: "300"
        run: >-
          uv run pytest -p no:cacheprovider --basetemp=/mnt/smb/pytest-remounted
          -q -rfEs tests/test_checkout_token.py

  # One test run alone many times on one runner, on a dispatch that names
  # it (`-f repeat_test=<node id>`): how a failure seen once is told apart
  # from a runner that stalled (ENG-201, the Windows concurrent start).
  # Each run is a pytest process of its own, so a failing run's output (the
  # test's own diagnostics) stands alone in the log; the job counts the
  # failures and fails when any run did. Never a gate: under workflow_call
  # `inputs.repeat_test` is unset, so release.yml's gate skips it.
  repeat:
    name: repeat (${{ inputs.repeat_os || 'windows-latest' }}, py3.14)
    runs-on: ${{ inputs.repeat_os || 'windows-latest' }}
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch' && inputs.repeat_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked --extra dev --python 3.14

      - name: Repeat the test
        shell: bash
        env:
          REPEAT_TEST: ${{ inputs.repeat_test }}
          REPEAT_RUNS: ${{ inputs.repeat_runs }}
        run: |
          failed=0
          for run in $(seq 1 "$REPEAT_RUNS"); do
            echo "run $run of $REPEAT_RUNS"
            if ! uv run pytest -p no:cacheprovider -q -rfE "$REPEAT_TEST"; then
              failed=$((failed + 1))
            fi
          done
          echo "$failed of $REPEAT_RUNS runs failed"
          test "$failed" -eq 0
