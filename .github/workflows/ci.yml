name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.15 is still pre-release (Oct 2026 final); uv resolves the bare
        # "3.15" spec to the latest python-build-standalone build, which
        # tracks the upstream RCs. Keep 3.11 — the pyproject floor.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # macOS and Windows slots for platform coverage:
        #   - platformdirs returns different paths per OS
        #   - the fcntl-based file locking in store.py / events.py only
        #     applies on POSIX; the no-op fallback runs on Windows
        #   - conftest.py works around macOS-specific UF_HIDDEN
        #     propagation in iCloud-synced dirs
        # Each non-Linux platform runs the current stable (3.14) and the
        # in-development next (3.15) — enough to catch OS-specific
        # regressions on the versions users will actually run, without
        # blowing the matrix up to a full 3 × 5 = 15 cross-product.
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=bettermemory --cov-report=term-missing --cov-fail-under=80 -q

  test-embeddings:
    name: test (embeddings extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pinned to 3.14 (current stable): sentence-transformers + torch
      # wheels lag the Python release cadence, so chasing 3.15 here just
      # means falling back to source builds and breaking CI for reasons
      # unrelated to bettermemory.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies (with embeddings extra)
        run: uv sync --extra dev --extra embeddings

      # The "no_extras" marker covers the three tests in test_semantic.py
      # that assert the extras are *absent*. Skipping them in this job
      # leaves the rest of the suite — including the cosine-similarity
      # paths — running against a real sentence-transformers install,
      # which is otherwise never exercised in CI.
      - name: Test (skipping no_extras-marked tests)
        run: uv run pytest -m "not no_extras" -q
