name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable as a reusable workflow so release.yml can gate the PyPI
  # publish on the FULL matrix (macOS/Windows + embeddings + pyright),
  # not just the core Linux gate. Additive: push/PR runs are unchanged.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # `experimental` is wired up so we can re-add pre-release Pythons
    # later without having to rebuild the workflow scaffolding around
    # `continue-on-error`. None of the current entries set it.
    #
    # RELEASE-GATE CAVEAT: this workflow is reused by release.yml to gate
    # the PyPI publish on the full matrix. A leg that sets
    # `experimental: true` is `continue-on-error`, so its failure will
    # NOT fail the `test` job, NOT fail this reusable workflow, and
    # therefore NOT block the publish — it is silently exempt from the
    # "publish only on a fully-green matrix" contract release.yml relies
    # on. Before adding any `experimental` leg, decide deliberately:
    # either it must NOT gate releases (current behavior — fine for a
    # genuinely pre-release Python), or move it to a separate
    # non-reusable job so the publish gate stays honest.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out as include entries (rather than os × python-version
        # cross + extra includes) so each slot can carry an `experimental`
        # flag without GitHub Actions' awkward matrix-overlay rules.
        #
        # py3.15 is intentionally absent. Two failure modes blocked it:
        #   - pydantic-core / rpds-py ship with PyO3 0.27.x, which caps
        #     at Python 3.14. uv falls back to a source build and the
        #     compile rejects 3.15.
        #   - PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 (PyO3's documented
        #     workaround) pulls in PyO3 0.28, but pydantic-core 2.46.4's
        #     source uses #[pyclass(extends=PyTzInfo)] which abi3 mode
        #     doesn't allow ("PyO3 does not support subclassing native
        #     types").
        # Both directions need an upstream pydantic-core release built
        # on PyO3 ≥ 0.28 without abi3-incompatible subclassing. Until
        # that ships, py3.15 has no path to passing — there's nothing
        # we can do from here, so we don't pretend by carrying a red
        # experimental slot. Re-add the entries once a compatible
        # pydantic-core release lands.
        #
        # Platform coverage rationale (why mac + win at all):
        #   - platformdirs returns different paths per OS
        #   - fcntl file locking in store.py / events.py is POSIX-only;
        #     Windows runs the no-op fallback
        #   - conftest.py works around macOS UF_HIDDEN in iCloud-synced
        #     dirs
        # 3.11 is the pyproject floor; we keep it pinned to ubuntu only.
        include:
          - {os: ubuntu-latest,  python-version: "3.11"}
          - {os: ubuntu-latest,  python-version: "3.12"}
          - {os: ubuntu-latest,  python-version: "3.13"}
          - {os: ubuntu-latest,  python-version: "3.14"}
          - {os: macos-latest,   python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # `[ui]` is installed alongside `[dev]` so mypy can resolve the
        # `fastapi` / `uvicorn` imports in `src/bettermemory/web.py`
        # (strict mode flags missing types on imported decorators) and
        # so `tests/test_web.py` runs as actual coverage instead of
        # being skipped via `pytest.importorskip("fastapi")`. The
        # `[embeddings]` extra stays in the dedicated `test-embeddings`
        # job — it pulls torch which dominates install time.
        run: uv sync --extra dev --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=bettermemory --cov-report=term-missing --cov-fail-under=80 -q

  typecheck-pyright:
    name: type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        # `[ui]` is installed so pyright resolves the fastapi / uvicorn
        # imports in web.py, mirroring the mypy step in the test job. The
        # `[tool.pyright]` config pins `venv = ".venv"`, which `uv sync`
        # populates here.
        run: uv sync --extra dev --extra ui

      - name: Pyright
        run: uv run pyright

  test-embeddings:
    name: test (embeddings extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pinned to 3.14 (current stable): sentence-transformers + torch
      # wheels lag the Python release cadence, so chasing 3.15 here just
      # means falling back to source builds and breaking CI for reasons
      # unrelated to bettermemory.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies (with embeddings extra)
        run: uv sync --extra dev --extra embeddings

      # The "no_extras" marker covers tests in test_semantic.py that
      # assert *both* embedding extras are absent. The narrower
      # "no_torch_embeddings" covers tests that assert specifically the
      # sentence-transformers path isn't installed — those land here
      # (torch IS installed in this job) so we deselect them too. Tests
      # marked "no_fastembed" still run: fastembed isn't installed in
      # this job, so the marker's assertion holds.
      - name: Test (skipping no_extras + no_torch_embeddings tests)
        run: uv run pytest -m "not no_extras and not no_torch_embeddings" -q

  test-embeddings-fast:
    name: test (embeddings-fast extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pinned to 3.13: fastembed's ONNX Runtime wheels lag the Python
      # release cadence by roughly a version. Re-evaluate when fastembed
      # ships 3.14 wheels and the bettermemory main matrix has moved on.
      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (with embeddings-fast extra)
        run: uv sync --extra dev --extra embeddings-fast

      # Same logic as test-embeddings but mirrored for fastembed:
      # deselect no_fastembed tests (fastembed IS installed here) and
      # the catch-all no_extras tests; leave no_torch_embeddings alone
      # because torch is absent in this job.
      - name: Test (skipping no_extras + no_fastembed tests)
        run: uv run pytest -m "not no_extras and not no_fastembed" -q
