name: Feature request
description: Suggest a new tool, a new option on an existing tool, or a behavior change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        bettermemory keeps a compatibility contract within each major
        line; see
        [CONTRIBUTING.md](https://github.com/0Mattias/bettermemory/blob/main/CONTRIBUTING.md#versioning-and-the-compatibility-contract)
        for what stays fixed. Additive features (new tools, new optional
        arguments) can land in a minor; renames, removals and changed
        meanings wait for the next major.

        Before opening, scan
        [docs/api.md](https://github.com/0Mattias/bettermemory/blob/main/docs/api.md)
        and the [closed issues](https://github.com/0Mattias/bettermemory/issues?q=is%3Aissue+is%3Aclosed).
        Many choices rejected on purpose are listed under *Limitations* in
        [docs/internals.md](https://github.com/0Mattias/bettermemory/blob/main/docs/internals.md#limitations).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        The user-facing scenario, not the implementation. *"Walk me
        through the happy path you wish were possible today but isn't."*
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: |
        What would the tool signature, CLI flag, or config option
        look like? Rough is fine: the proposal is a starting point
        for design discussion, not a spec.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Have you tried any workarounds with the current surface? Why
        are they insufficient? This is the section that most clearly
        distinguishes "needs a feature" from "needs a docs
        clarification".

  - type: dropdown
    id: breaking
    attributes:
      label: Compatibility
      description: |
        Is this additive (compatible within the current major) or does
        it require breaking an existing behavior?
      options:
        - Additive (new tool, new optional argument, new config)
        - Behavior change (could break existing users)
        - Not sure
    validations:
      required: true
