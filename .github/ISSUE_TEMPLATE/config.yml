# Disable blank issues — push everything through one of the templates
# so we get consistent context. Users with a real "none of these fit"
# case can still file via the Discussions tab or the SECURITY.md flow
# for vulnerabilities.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/0Mattias/bettermemory/security/advisories/new
    about: >-
      Please report security issues privately, NOT in public issues.
      See SECURITY.md for the disclosure flow.
  - name: Question or discussion
    url: https://github.com/0Mattias/bettermemory/discussions
    about: >-
      For "how do I…" questions, design discussions, or anything that
      isn't a bug report, feature request, or install failure.
