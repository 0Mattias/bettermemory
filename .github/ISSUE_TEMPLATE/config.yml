# Disable blank issues: push everything through one of the templates
# so we get consistent context. The contact links below cover the rest.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/0Mattias/bettermemory/security/policy
    about: >-
      Report security issues privately, not in public issues. The
      policy names both private channels.
  - name: Question
    url: https://github.com/0Mattias/bettermemory/tree/main/docs
    about: >-
      Read the docs, or email hello@anaphase.ai with a "how do I…"
      question or anything else that is not a bug report, feature
      request or install failure.
