name: Install / setup failure
description: bettermemory installs, but the MCP server doesn't start, or the model doesn't see the tools.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the diagnostics field first. `bettermemory status` and
        the daemon's log show whether the package runs, which store it
        opens and whether its daemon started.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        The output of `bettermemory status`, the last 20 lines of the
        daemon log (`daemon-<hash>.log`, beside the `daemon-<hash>.json`
        state file in bettermemory's user state directory, or in
        `BETTERMEMORY_STATE_DIR` when it is set), and anything printed
        when you run `bettermemory` by hand. Leave out
        `bettermemory health` output: it contains memory summaries.
      render: shell
      placeholder: |
        $ bettermemory status
        bettermemory daemon: not running for <store path>
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      description: Which client are you trying to register bettermemory with?
      options:
        - Claude Code (CLI)
        - Claude Code (plugin install)
        - Claude Desktop
        - Cursor
        - Continue
        - Cline
        - Hermes Agent
        - Other (describe in "What happened?")
    validations:
      required: true

  - type: input
    id: install_command
    attributes:
      label: How did you install bettermemory?
      description: e.g. `uv tool install bettermemory`, `pipx install bettermemory`, `pip install -e .` from a clone
      placeholder: uv tool install bettermemory
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bettermemory version
      description: Output of `bettermemory --version`.
      placeholder: bettermemory 9.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Python version
      description: e.g. macOS 14.5 / Python 3.13.1
      placeholder: macOS 14.5 / Python 3.13.1
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: |
        What did you try, what did you expect, what did you see
        instead? Include exact error messages, log lines from your
        MCP client (Claude Desktop's `mcp.log`, Cursor's developer
        tools console, etc.), and any commands you ran by hand.
    validations:
      required: true

  - type: textarea
    id: anything_else
    attributes:
      label: Anything else
      description: Other context that might help. Optional.
