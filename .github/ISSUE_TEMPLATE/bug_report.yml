name: Bug report
description: bettermemory is installed and the MCP server starts, but a tool misbehaves or returns the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For install or setup failures (the server does not start, the
        model does not see the tools, `bettermemory status` reports no
        daemon), use the **Install / setup failure** template instead.

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: |
        A clear, minimal description of the misbehavior. Include the
        exact tool call (memory_search / memory_write / …), the
        arguments you (or the model) passed, and what came back. Paste
        from the MCP client's tool-call log if available.
      placeholder: |
        Called memory_search(query="x", auto_scope=False) and got back
        an empty list, but `bettermemory export --scope projects:x`
        lists 5 memories matching the query. Expected at least one hit.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: How should the call have behaved?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Smallest sequence of tool calls (or `bettermemory` CLI commands)
        that triggers the bug from a clean store.
      render: shell
      placeholder: |
        export BETTERMEMORY_DIR=/tmp/repro
        bettermemory down     # stop any daemon serving this store
        rm -rf "$BETTERMEMORY_DIR"
        bettermemory health   # confirms an empty store
        # ... the failing sequence
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bettermemory version
      description: Output of `bettermemory --version`.
      placeholder: bettermemory 9.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Python version
      placeholder: macOS 14.5 / Python 3.13.1
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: bettermemory status output (optional)
      description: |
        Paste `bettermemory status`, and `bettermemory log verify --json`
        if you suspect the store itself. Skip this if the bug reproduces
        in a clean temporary store.
      render: shell
