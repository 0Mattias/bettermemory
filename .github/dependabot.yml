# Keep CI actions and Python deps current. Both updaters are weekly to
# avoid a noisy daily PR stream; the package is small enough that monthly
# would let easy security patches sit too long.
#
# Every updater pins `commit-message.prefix`. Without one Dependabot
# infers the prefix and the capitalisation from recent history, which has
# produced both `Bump the actions group across 1 directory with 2 updates`
# and `chore(deps): Bump the actions group with 3 updates` in this repo —
# subjects the `commit-lint` CI job rejects for a shape the bot's own
# template chose. Pinning the prefix keeps the bot inside the house
# envelope; `commit_lint._is_bot_author` is the backstop for the parts of
# a Dependabot message (the generated `Bumps the … group with N updates:
# [a](url), [b](url)` body line) that no configuration can reshape.
# Prefixes must be a type from `commit_lint.TYPES`, which
# `tests/test_commit_lint.py` pins by grading a subject built from each.
#
# Python dependencies go through the `uv` ecosystem. The `pip` updater this
# file carried before never opened a pull request: it does not read or
# write uv.lock, and the lock is what every CI job installs from
# (`uv sync --locked`). `versioning-strategy: lockfile-only` keeps the bot
# to the lock. The ranges in pyproject.toml are deliberate, each with its
# reason in a comment there (the mcp `<3.0.0` cap is an incident's lesson),
# and only a person widens one. Minor and patch updates arrive grouped; a
# major one inside a range comes as its own pull request, so it is read on
# its own. The cooldown keeps a release out of the lock until it has been
# public for a week; security updates are not held by it.
# `tests/test_dependabot_config.py` pins all of this.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
      prefix-development: "chore(deps)"
    groups:
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
